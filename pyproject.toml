[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgma"
version = "0.1.0"
description = "Lie-Generated Metric Attention research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
data = [
  "datasets",
  "huggingface_hub",
  "pyarrow",
  "tokenizers",
]
vla = [
  "h5py",
  "numpy",
  "pillow",
]
tracking = [
  "wandb",
]
bert = [
  "accelerate",
  "datasets",
  "evaluate",
  "transformers",
]
vision = [
  "pillow",
  "timm==1.0.19",
  "torchvision",
  "webdataset",
]
eval = [
  "imageio",
  "openai",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:.*An output with one or more elements was resized.*:UserWarning",
]
